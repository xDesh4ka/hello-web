<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="slides-format" content="viewport">
<title>Лекция 5 — Проектирование API и транзакционные базы данных</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fcfbf9;
  --surface: #fff;
  --stone-100: #f3f1ec;
  --stone-200: #e6e2d8;
  --muted: #78716c;
  --text: #44403c;
  --heading: #1c1917;
  --indigo-50: #eef2ff;
  --indigo-100: #e0e7ff;
  --indigo: #4f46e5;
  --indigo-dark: #4338ca;
  --green: #059669;
  --amber: #d97706;
  --red: #dc2626;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}

button, select, input { font: inherit; }

button, select, summary { cursor: pointer; }

button:focus-visible,
select:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 3px solid #a5b4fc;
  outline-offset: 3px;
}

.progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  background: var(--indigo);
  z-index: 100;
  transition: width .25s;
}

.topbar {
  min-height: 68px;
  padding: 12px max(20px, calc((100vw - 1260px) / 2));
  background: rgba(255,255,255,.95);
  border-bottom: 1px solid var(--stone-200);
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--indigo);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 900;
  flex-shrink: 0;
}

.brand b {
  color: var(--heading);
  display: block;
  font-size: 14px;
}

.brand small {
  color: var(--muted);
  font-size: 11px;
}

.mode {
  display: flex;
  padding: 4px;
  gap: 3px;
  border: 1px solid var(--stone-200);
  border-radius: 12px;
  background: var(--stone-100);
}

.mode button {
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
}

.mode button.active {
  background: white;
  color: var(--indigo-dark);
  box-shadow: 0 1px 4px #00000012;
}

.container {
  max-width: 1260px;
  margin: auto;
  padding: 22px;
}

.controller {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto auto;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border: 1px solid var(--stone-200);
  border-radius: 17px;
  background: white;
  margin-bottom: 18px;
}

.controller select {
  width: 100%;
  padding: 11px 12px;
  color: var(--heading);
  background: var(--bg);
  border: 1px solid var(--stone-200);
  border-radius: 11px;
  font-size: 13px;
  font-weight: 600;
}

.badge {
  padding: 8px 11px;
  border-radius: 9px;
  background: var(--indigo-50);
  color: var(--indigo-dark);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.controls { display: flex; gap: 7px; }

.btn {
  border: 0;
  background: var(--stone-100);
  color: var(--text);
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
}

.btn.primary {
  color: white;
  background: var(--indigo);
}

.btn:disabled { opacity: .35; cursor: default; }

.screen {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--stone-200);
  border-radius: 26px;
  background: white;
  box-shadow: 0 3px 12px #00000008;
}

.deck {
  position: absolute;
  width: 1200px;
  height: 675px;
  transform-origin: top left;
  transform: scale(var(--scale, 1));
}

.slide {
  position: absolute;
  inset: 0;
  width: 1200px;
  height: 675px;
  padding: 32px 44px 24px;
  background: white;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: scale(.97);
  pointer-events: none;
  transition: opacity .45s ease, transform .45s ease;
  overflow: hidden;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
  z-index: 2;
}

.gradient-mesh {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.blob {
  width: 330px;
  height: 330px;
  position: absolute;
  border-radius: 50%;
  background: #c7d2fe;
  filter: blur(75px);
  opacity: .075;
  right: -90px;
  top: -100px;
  animation: drift 16s ease-in-out infinite;
}

.blob + .blob {
  background: #ddd6fe;
  left: -100px;
  bottom: -160px;
  top: auto;
  animation-direction: reverse;
}

@keyframes drift {
  50% { transform: translate(-30px, 28px) scale(1.08); }
}

.slide-head,
.slide h2,
.slide-body,
.source-line {
  position: relative;
  z-index: 1;
}

.slide-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--stone-100);
  min-height: 28px;
}

.module-label {
  font-size: 11px;
  color: var(--indigo);
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.slide-number {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: #a8a29e;
}

.slide h2 {
  color: var(--heading);
  font-size: 31px;
  line-height: 1.16;
  letter-spacing: -.035em;
  margin: 20px 0 17px;
  font-weight: 800;
}

.slide-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 15px;
}

.lead {
  margin: 0;
  font-size: 18px;
  line-height: 1.5;
  color: var(--text);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.card {
  padding: 17px;
  border: 1px solid var(--stone-200);
  border-radius: 16px;
  background: var(--bg);
  transition: transform .2s, box-shadow .2s;
}

.card:nth-child(3n + 2) {
  background: #eef2ff90;
  border-color: var(--indigo-100);
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 18px #4f46e510;
}

.card-icon {
  color: var(--indigo);
  font-weight: 900;
  font-size: 23px;
  margin-bottom: 9px;
}

.card h3 {
  font-size: 16px;
  line-height: 1.25;
  color: var(--heading);
  margin: 0 0 8px;
}

.card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.48;
}

.columns {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  align-items: stretch;
}

.column {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 13px;
  min-width: 0;
}

.column h3 {
  color: var(--heading);
  margin: 0;
  font-size: 17px;
}

.callout {
  padding: 12px 15px;
  border-left: 4px solid var(--indigo);
  border-radius: 0 12px 12px 0;
  background: var(--indigo-50);
  font-size: 14px;
  line-height: 1.48;
}

.callout strong {
  color: var(--indigo-dark);
  margin-right: 7px;
}

.callout.amber {
  background: #fffbeb;
  border-color: #f59e0b;
}

.callout.amber strong { color: #92400e; }

.callout.green {
  background: #ecfdf5;
  border-color: var(--green);
}

.callout.green strong { color: #047857; }

.table-wrap {
  border: 1px solid var(--stone-200);
  border-radius: 14px;
  overflow: hidden;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
  line-height: 1.38;
}

th {
  background: var(--stone-100);
  color: var(--heading);
  font-weight: 800;
  text-align: left;
}

th, td { padding: 10px 12px; }

td {
  border-top: 1px solid var(--stone-100);
  vertical-align: top;
}

tbody tr:nth-child(even) { background: #fafaf9; }

code {
  font-family: "JetBrains Mono", monospace;
  font-size: .89em;
  overflow-wrap: anywhere;
}

p code, td code, li code, .callout code, .step code {
  background: #e0e7ff75;
  color: #4338ca;
  padding: 1px 4px;
  border-radius: 4px;
}

.codebox {
  background: var(--heading);
  color: #e7e5e4;
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
}

.codebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 27px;
  padding: 5px 13px;
  color: #a8a29e;
  background: #292524;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
}

.copy {
  border: 0;
  padding: 2px 4px;
  color: #d6d3d1;
  background: transparent;
  font-size: 10px;
}

pre {
  padding: 14px 16px;
  margin: 0;
  font: 14px/1.42 "JetBrains Mono", monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  tab-size: 2;
}

pre code {
  font: inherit;
  color: inherit;
}

.bullets {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 10px;
}

.bullets li {
  background: var(--bg);
  border: 1px solid var(--stone-200);
  border-radius: 12px;
  padding: 11px 14px 11px 37px;
  position: relative;
  font-size: 15px;
  line-height: 1.42;
}

.bullets li::before {
  content: "✓";
  color: var(--indigo);
  font-weight: 900;
  position: absolute;
  left: 14px;
}

.steps { display: grid; gap: 9px; }

.step {
  display: grid;
  grid-template-columns: 31px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px 13px;
  border: 1px solid var(--stone-200);
  border-radius: 12px;
  background: white;
}

.step-number {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--indigo);
  color: white;
  font-size: 13px;
  font-weight: 900;
}

.step b { color: var(--heading); font-size: 14px; }

.step p {
  font-size: 13px;
  line-height: 1.4;
  margin: 3px 0 0;
}

.diagram {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  width: 100%;
}

.node {
  flex: 1;
  min-width: 0;
  max-width: 235px;
  border: 1px solid var(--stone-200);
  border-radius: 16px;
  padding: 17px 11px;
  text-align: center;
  background: white;
  box-shadow: 0 2px 5px #00000005;
}

.node .icon {
  display: block;
  font-size: 31px;
  margin-bottom: 8px;
}

.node b { display: block; font-size: 14px; color: var(--heading); }

.node small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  margin-top: 6px;
}

.arrow {
  flex-shrink: 0;
  color: var(--indigo);
  font-size: 27px;
  font-weight: 900;
}

.source-line {
  margin-top: 13px;
  min-height: 17px;
  font-size: 10px;
  color: #a8a29e;
  display: flex;
  flex-wrap: wrap;
  gap: 5px 12px;
}

.source-line a { color: #78716c; text-decoration: none; }

.source-line a:hover { text-decoration: underline; color: var(--indigo); }

.kind-cover {
  background: linear-gradient(135deg, #fff 0%, #f5f3ff 52%, #eef2ff 100%);
}

.kind-cover h2 { display: none; }

.cover { text-align: center; }

.cover-hero {
  font-size: 75px;
  letter-spacing: 13px;
  margin-bottom: 22px;
  animation: float 3.5s ease-in-out infinite;
}

@keyframes float { 50% { transform: translateY(-9px); } }

.cover h1 {
  font-size: 47px;
  line-height: 1.13;
  letter-spacing: -.045em;
  color: var(--heading);
  margin: 0 auto 18px;
  max-width: 930px;
}

.cover p {
  max-width: 820px;
  margin: 0 auto 25px;
  font-size: 20px;
  line-height: 1.5;
}

.tags {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
}

.tags span {
  background: var(--indigo-50);
  color: var(--indigo-dark);
  border: 1px solid var(--indigo-100);
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.reveal { opacity: 1; }

.slide.active .reveal {
  animation: appear .4s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}

.hint {
  text-align: center;
  padding: 14px 0 5px;
  font-size: 11px;
  color: #a8a29e;
}

.notes-panel {
  display: none;
  padding: 20px 24px;
  border-radius: 16px;
  background: white;
  border: 1px solid var(--stone-200);
  margin-top: 15px;
  line-height: 1.65;
  font-size: 14px;
}

.notes-panel.show { display: block; }

.notes-panel h3 {
  color: var(--indigo-dark);
  margin: 0 0 8px;
  font-size: 14px;
}

.notes-panel p { margin: 0; }

.reader { display: none; }

.reader.show {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 24px;
}

.toc {
  position: sticky;
  top: 88px;
  max-height: calc(100vh - 110px);
  overflow: auto;
  align-self: start;
  padding: 12px;
  border: 1px solid var(--stone-200);
  border-radius: 16px;
  background: white;
}

.toc a {
  display: block;
  text-decoration: none;
  color: var(--text);
  font-size: 12px;
  line-height: 1.4;
  padding: 8px;
  border-radius: 8px;
}

.toc a:hover { background: var(--indigo-50); color: var(--indigo); }

.articles { display: grid; gap: 20px; }

.article {
  background: white;
  border: 1px solid var(--stone-200);
  border-radius: 18px;
  padding: 26px;
  scroll-margin-top: 90px;
}

.article .module-label { display: block; margin-bottom: 12px; }

.article h2 {
  margin: 0 0 20px;
  color: var(--heading);
  font-size: 25px;
  line-height: 1.25;
}

.article-body { display: grid; gap: 16px; }

.article details {
  margin-top: 18px;
  background: var(--stone-100);
  padding: 13px 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.65;
}

.article details p { margin: 10px 0 0; }

.article summary { color: var(--indigo-dark); font-weight: 800; }

.article .cover h1 { font-size: 34px; }

.article .cover-hero { font-size: 55px; }

.screenshot-slot {
  border: 2px dashed #a5b4fc;
  border-radius: 17px;
  background: #f5f7ff;
  min-height: 295px;
  height: 295px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.screenshot-slot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: white;
}

.upload-text { padding: 20px; }

.upload-text b { display: block; color: var(--indigo-dark); margin-bottom: 10px; }

.upload-text p { font-size: 13px; line-height: 1.5; margin: 0 0 15px; }

.upload-input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.mini {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.screen:fullscreen {
  border-radius: 0;
  border: 0;
  background: var(--bg);
  width: 100vw;
  height: 100vh;
}

@media (max-width: 850px) {
  .controller { grid-template-columns: 1fr auto; }
  .controller select { grid-column: 1 / -1; }
  .brand small { display: none; }
  .reader.show { grid-template-columns: 1fr; }
  .toc { display: none; }
  .article .columns { grid-template-columns: 1fr; }
  .article .card-grid { grid-template-columns: 1fr; }
  .article .diagram { flex-wrap: wrap; }
}

@media (max-width: 550px) {
  .container { padding: 12px; }
  .topbar { padding: 10px 12px; }
  .brand b { font-size: 11px; }
  .mode button { font-size: 11px; padding: 7px; }
  .screen { border-radius: 15px; }
  .article { padding: 18px; }
  .hint { line-height: 1.8; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

@media print {
  @page { size: 320mm 180mm; margin: 0; }

  body { background: white; }

  .topbar, .controller, .hint, .notes-panel,
  .reader, .progress, .copy, .upload-input { display: none !important; }

  .container { padding: 0; max-width: none; }

  .screen {
    overflow: visible;
    width: auto;
    height: auto;
    aspect-ratio: auto;
    border: 0;
    box-shadow: none;
    border-radius: 0;
  }

  .deck {
    position: static;
    transform: none !important;
    width: auto;
    height: auto;
  }

  .slide {
    position: relative;
    width: 320mm;
    height: 180mm;
    opacity: 1 !important;
    transform: none !important;
    pointer-events: auto;
    page-break-after: always;
    break-after: page;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .slide:last-child { break-after: auto; }

  .reveal { animation: none !important; }
  .blob { animation: none !important; }
}
</style>
</head>

<body>
<div class="progress" id="progress"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">05</div>
    <div>
      <b>API и транзакционные базы данных</b>
      <small>Лекция 5 · от публичного контракта до надёжной записи</small>
    </div>
  </div>

  <div class="mode">
    <button id="slidesMode" class="active" type="button">Слайды</button>
    <button id="readerMode" type="button">Чтение</button>
    <button id="printButton" type="button" title="Печать или сохранение в PDF">PDF</button>
  </div>
</header>

<main class="container">
  <section id="presentation">
    <div class="controller">
      <select id="picker" aria-label="Перейти к слайду"></select>

      <span class="badge" id="counter">1 / 60</span>

      <div class="controls">
        <button class="btn" id="prev" aria-label="Предыдущий слайд">←</button>
        <button class="btn primary" id="next" aria-label="Следующий слайд">Далее →</button>
        <button class="btn" id="notesButton" title="Заметки — N">Заметки</button>
        <button class="btn" id="fullscreen" title="Полный экран — F">⛶</button>
      </div>
    </div>

    <div class="screen" id="screen">
      <div class="deck" id="deck"></div>
    </div>

    <div class="hint">
      ← → / Пробел — листать · Home / End — начало / конец ·
      F — полный экран · N — заметки · R — режим чтения
    </div>

    <aside class="notes-panel" id="notesPanel">
      <h3>Заметки</h3>
      <p id="notesText"></p>
    </aside>
  </section>

  <section class="reader" id="reader">
    <nav class="toc" id="toc" aria-label="Оглавление"></nav>
    <div class="articles" id="articles"></div>
  </section>
</main>

<script>
"use strict";

/* =========================================================
   Источники и небольшие функции для сборки содержимого.
   Примеры TaskFlow — учебные, а не описание реального сервиса.
   ========================================================= */

const SOURCES = {
  habr: [
    "Хабр: проектирование API",
    "https://habr.com/ru/articles/891684/"
  ],
  http: [
    "HTTP: RFC 9110",
    "https://www.rfc-editor.org/rfc/rfc9110.html"
  ],
  soap: [
    "W3C: SOAP 1.2",
    "https://www.w3.org/TR/soap12-part1/"
  ],
  oas: [
    "OpenAPI 3.1",
    "https://swagger.io/specification/v3.1/"
  ],
  swagger: [
    "Swagger / OpenAPI tooling",
    "https://learn.microsoft.com/en-us/aspnet/core/tutorials/web-api-help-pages-using-swagger?view=aspnetcore-8.0"
  ],
  auth: [
    "MDN: HTTP authentication",
    "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Authentication"
  ],
  jwt: [
    "JWT: RFC 7519",
    "https://datatracker.ietf.org/doc/rfc7519/"

function esc(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function lead(text) {
  return '<p class="lead reveal">' + text + '</p>';
}

function callout(title, text, tone = "") {
  return '<div class="callout reveal ' + tone + '"><strong>' +
    title + '</strong>' + text + '</div>';
}

function code(text, lang = "") {
  return '<div class="codebox reveal"><div class="codebar"><span>' +
    esc(lang) + '</span><button type="button" class="copy">КОПИРОВАТЬ</button>' +
    '</div><pre><code>' + esc(text.trim()) + '</code></pre></div>';
}

function cards(items, columns = 3) {
  return '<div class="card-grid reveal" style="grid-template-columns:repeat(' +
    columns + ',minmax(0,1fr))">' + items.map(item =>
      '<div class="card"><div class="card-icon">' + item[0] +
      '</div><h3>' + item[1] + '</h3><p>' + item[2] + '</p></div>'
    ).join("") + '</div>';
}

function columns(left, right) {
  return '<div class="columns reveal"><div class="column">' + left +
    '</div><div class="column">' + right + '</div></div>';
}

function table(headers, rows) {
  return '<div class="table-wrap reveal"><table><thead><tr>' +
    headers.map(h => '<th>' + h + '</th>').join("") +
    '</tr></thead><tbody>' +
    rows.map(row => '<tr>' + row.map(cell => '<td>' + cell + '</td>').join("") + '</tr>').join("") +
    '</tbody></table></div>';
}

function bullets(items) {
  return '<ul class="bullets reveal">' +
    items.map(item => '<li>' + item + '</li>').join("") + '</ul>';
}

function steps(items) {
  return '<div class="steps reveal">' +
    items.map((item, i) =>
      '<div class="step"><span class="step-number">' + (i + 1) +
      '</span><div><b>' + item[0] + '</b><p>' + item[1] + '</p></div></div>'
    ).join("") + '</div>';
}

function diagram(items) {
  return '<div class="diagram reveal">' +
    items.map((item, i) =>
      (i ? '<div class="arrow">→</div>' : '') +
      '<div class="node"><span class="icon">' + item[0] +
      '</span><b>' + item[1] + '</b><small>' + item[2] + '</small></div>'
    ).join("") + '</div>';
}

function add(module, title, content, notes, sources = [], kind = "content") {
  slides.push({
    id: slides.length + 1,
    module, title, content, notes, sources, kind
  });
}

});

$("toc").innerHTML = slides.map(slide =>
  '<a href="#read-' + slide.id + '">' +
  String(slide.id).padStart(2, "0") + ' · ' + slide.title + '</a>'
).join("");

$("articles").innerHTML = slides.map(slide =>
  '<article class="article" id="read-' + slide.id + '">' +
    '<span class="module-label">' + slide.module + ' · ' + slide.id + '/60</span>' +
    '<h2>' + slide.title + '</h2>' +
    '<div class="article-body">' + slide.content + '</div>' +
    sourcesHtml(slide.sources) +
    '<details><summary>Заметки</summary><p>' +
      slide.notes + '</p></details>' +
  '</article>'
).join("");

function updateNav() {
  $("counter").textContent = (current + 1) + " / " + slides.length;
  picker.value = current;
  $("prev").disabled = current === 0;
  $("next").disabled = current === slides.length - 1;
  $("progress").style.width = ((current + 1) / slides.length * 100) + "%";
  $("notesText").textContent = slides[current].notes;
}

function goToSlide(index, updateHash = true) {
  if (!Number.isInteger(index)) return;
  index = Math.max(0, Math.min(slides.length - 1, index));

  const previous = deck.querySelector(".slide.active");
  if (previous) {
    previous.classList.remove("active");
    previous.setAttribute("aria-hidden", "true");
  }

  current = index;
  const next = deck.querySelector('[data-slide="' + (index + 1) + '"]');
  next.classList.add("active");
  next.setAttribute("aria-hidden", "false");

  updateNav();

  if (updateHash) {
    try {
      history.replaceState(null, "", "#slide-" + (current + 1));
    } catch (_) {}
  }
}

function changeSlide(delta) {
  goToSlide(current + delta);
}

function resizeDeck() {
  const screen = $("screen");
  const fullscreen = document.fullscreenElement === screen;

  let scale = screen.clientWidth / 1200;

  if (fullscreen) {
    scale = Math.min(screen.clientWidth / 1200, screen.clientHeight / 675);
    deck.style.left = ((screen.clientWidth - 1200 * scale) / 2) + "px";
    deck.style.top = ((screen.clientHeight - 675 * scale) / 2) + "px";
  } else {
    deck.style.left = "0px";
    deck.style.top = "0px";
  }

  deck.style.setProperty("--scale", scale);
}

function setMode(reading) {
  readerIsActive = reading;
  reader.classList.toggle("show", reading);
  presentation.hidden = reading;
  $("readerMode").classList.toggle("active", reading);
  $("slidesMode").classList.toggle("active", !reading);

  if (!reading) {
    requestAnimationFrame(resizeDeck);
  }
}

function toggleNotes() {
  notesAreVisible = !notesAreVisible;
  $("notesPanel").classList.toggle("show", notesAreVisible);
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await $("screen").requestFullscreen();
    }
  } catch (_) {}
}

$("prev").addEventListener("click", () => changeSlide(-1));
$("next").addEventListener("click", () => changeSlide(1));
picker.addEventListener("change", event => goToSlide(Number(event.target.value)));

$("slidesMode").addEventListener("click", () => setMode(false));
$("readerMode").addEventListener("click", () => setMode(true));
$("notesButton").addEventListener("click", toggleNotes);
$("fullscreen").addEventListener("click", toggleFullscreen);

$("printButton").addEventListener("click", () => window.print());

document.addEventListener("fullscreenchange", resizeDeck);
window.addEventListener("resize", resizeDeck);

if ("ResizeObserver" in window) {
  new ResizeObserver(resizeDeck).observe($("screen"));
}

/* Keyboard shortcuts do not interfere with inputs and selection. */

document.addEventListener("keydown", event => {
  const target = event.target;

  if (
    target.closest("input, textarea, select, button") ||
    target.isContentEditable ||
    event.ctrlKey || event.metaKey || event.altKey
  ) return;

  const key = event.key.toLowerCase();

  if (key === "r") {
    event.preventDefault();
    setMode(!readerIsActive);
    return;
  }

  if (readerIsActive) return;

  if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
    event.preventDefault();
    changeSlide(1);
  } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    changeSlide(-1);
  } else if (event.key === "Home") {
    event.preventDefault();
    goToSlide(0);
  } else if (event.key === "End") {
    event.preventDefault();
    goToSlide(slides.length - 1);
  } else if (key === "n") {
    toggleNotes();
  } else if (key === "f") {
    toggleFullscreen();
  }
});

/* Touch navigation. */

let touchStart = null;

$("screen").addEventListener("touchstart", event => {
  if (event.target.closest("input,button")) return;
  touchStart = {
    x: event.changedTouches[0].clientX,
    y: event.changedTouches[0].clientY
  };
}, { passive: true });

$("screen").addEventListener("touchend", event => {
  if (!touchStart) return;

  const dx = event.changedTouches[0].clientX - touchStart.x;
  const dy = event.changedTouches[0].clientY - touchStart.y;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    changeSlide(dx < 0 ? 1 : -1);
  }

  touchStart = null;
}, { passive: true });

/* Copy examples. Includes a fallback for file:// environments. */

document.addEventListener("click", async event => {
  const button = event.target.closest(".copy");
  if (!button) return;

  const text = button.closest(".codebox").querySelector("code").textContent;
  let copied = false;

  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch (_) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    copied = document.execCommand("copy");
    textarea.remove();
  }

  button.textContent = copied ? "СКОПИРОВАНО" : "ВЫДЕЛИТЕ КОД";
  setTimeout(() => button.textContent = "КОПИРОВАТЬ", 1600);
});

/* Swagger screenshot: local preview and optional browser persistence. */

function applyScreenshot(data) {
  document.querySelectorAll("[data-screenshot-slot]").forEach(slot => {
    let image = slot.querySelector("img");

    if (!image) {
      image = document.createElement("img");
      image.alt = "Скриншот Swagger UI";
      slot.prepend(image);
    }

    image.src = data;

    const placeholder = slot.querySelector(".upload-text");
    if (placeholder) placeholder.style.display = "none";
  });
}

function loadImage(file) {
  if (!file || !file.type.startsWith("image/")) return;

  const fileReader = new FileReader();
  fileReader.onload = () => {
    screenshotData = String(fileReader.result);
    applyScreenshot(screenshotData);

    try {
      localStorage.setItem("lecture5-swagger-image", screenshotData);
    } catch (_) {
      /* Large images may exceed browser quota; preview still works. */
    }
  };
  fileReader.readAsDataURL(file);
}

document.querySelectorAll(".upload-input").forEach(input => {
  input.addEventListener("change", event => loadImage(event.target.files[0]));
});

document.querySelectorAll("[data-screenshot-slot]").forEach(slot => {
  slot.addEventListener("dragover", event => event.preventDefault());
  slot.addEventListener("drop", event => {
    event.preventDefault();
    loadImage(event.dataTransfer.files[0]);
  });
});

if (screenshotData) applyScreenshot(screenshotData);

/* Mark hidden slides for assistive technology and restore a direct link. */

deck.querySelectorAll(".slide").forEach((slide, index) => {
  slide.setAttribute("aria-hidden", index === 0 ? "false" : "true");
});

const hashMatch = location.hash.match(/^#slide-(\d+)$/);
goToSlide(hashMatch ? Number(hashMatch[1]) - 1 : 0, false);

requestAnimationFrame(resizeDeck);
</script>
</body>
</html>
