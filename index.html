<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="slides-format" content="viewport">
<title>Введение в DevOps — лекция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#fcfbf9;
  --surface:#fff;
  --stone-100:#f3f1ec;
  --stone-200:#e6e2d8;
  --muted:#78716c;
  --text:#44403c;
  --heading:#1c1917;
  --indigo-50:#eef2ff;
  --indigo-100:#e0e7ff;
  --indigo:#4f46e5;
  --indigo-dark:#4338ca;
  --green:#059669;
  --amber:#d97706;
  --red:#dc2626;
  --code-bg:#171923;
  --scale:1;
}
* {box-sizing:border-box}
html,body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}
button,select,input {font:inherit}
button,select,summary {cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible {
  outline:3px solid #a5b4fc;outline-offset:3px;
}
button {transition:background .2s,transform .2s}
button:hover {filter:brightness(.97)}
.progress {
  position:fixed;top:0;left:0;height:5px;background:var(--indigo);
  z-index:200;transition:width .25s;
}
.topbar {
  min-height:68px;padding:12px max(20px,calc((100vw - 1260px)/2));
  background:rgba(255,255,255,.95);border-bottom:1px solid var(--stone-200);
  position:sticky;top:0;z-index:50;display:flex;
  justify-content:space-between;align-items:center;gap:18px;
  backdrop-filter:blur(12px);
}
.brand {display:flex;align-items:center;gap:12px}
.logo {
  width:40px;height:40px;border-radius:12px;background:var(--indigo);
  color:white;display:grid;place-items:center;font-weight:900;
}
.brand b {color:var(--heading);display:block;font-size:14px}
.brand small {color:var(--muted);font-size:11px}
.mode {
  display:flex;padding:4px;gap:3px;border:1px solid var(--stone-200);
  border-radius:12px;background:var(--stone-100);
}
.mode button {
  background:transparent;border:0;border-radius:8px;padding:8px 12px;
  color:var(--text);font-size:12px;font-weight:800;
}
.mode button.active {
  background:white;color:var(--indigo-dark);box-shadow:0 1px 4px #00000012;
}
.container {max-width:1260px;margin:auto;padding:22px}
.controller {
  display:grid;grid-template-columns:minmax(200px,1fr) auto auto;
  gap:12px;align-items:center;padding:14px;border:1px solid var(--stone-200);
  border-radius:17px;background:white;margin-bottom:18px;
}
.controller select {
  width:100%;padding:11px 12px;color:var(--heading);background:var(--bg);
  border:1px solid var(--stone-200);border-radius:11px;font-size:13px;
}
.badge {
  padding:8px 11px;border-radius:9px;background:var(--indigo-50);
  color:var(--indigo-dark);font-size:12px;font-weight:800;white-space:nowrap;
}
.controls {display:flex;gap:7px}
.btn {
  border:0;background:var(--stone-100);color:var(--text);
  padding:10px 13px;border-radius:10px;font-size:12px;font-weight:800;
}
.btn.primary {color:white;background:var(--indigo)}
.btn:disabled {opacity:.35;cursor:default}
.screen {
  width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;
  border:1px solid var(--stone-200);border-radius:26px;background:white;
  box-shadow:0 3px 12px #00000008;
}
.deck {
  position:absolute;width:1200px;height:675px;
  transform-origin:top left;transform:scale(var(--scale));
}
.slide {
  position:absolute;inset:0;width:1200px;height:675px;
  padding:30px 44px 22px;background:white;display:flex;flex-direction:column;
  opacity:0;transform:scale(.97);pointer-events:none;
  transition:opacity .45s ease,transform .45s ease;overflow:hidden;
}
.slide.active {
  opacity:1;transform:scale(1);pointer-events:auto;z-index:2;
}
.gradient-mesh {
  position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;
}
.blob {
  width:330px;height:330px;position:absolute;border-radius:50%;
  background:#c7d2fe;filter:blur(75px);opacity:.075;
  right:-90px;top:-100px;animation:drift 16s ease-in-out infinite;
}
.blob+.blob {
  background:#ddd6fe;left:-100px;bottom:-160px;top:auto;
  animation-delay:-7s;
}
@keyframes drift {
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-25px,25px)}
}
.content {
  position:relative;z-index:2;display:flex;flex-direction:column;
  flex:1;min-height:0;
}
.eyebrow {
  color:var(--indigo);font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px;
}
h1,h2,h3,p {margin:0}
h1 {font-size:48px;line-height:1.1;letter-spacing:-1.8px;color:var(--heading)}
h2 {font-size:33px;line-height:1.15;letter-spacing:-1px;color:var(--heading)}
.subtitle {font-size:17px;line-height:1.45;color:var(--muted);margin-top:10px}
.body {
  flex:1;min-height:0;display:flex;flex-direction:column;
  justify-content:center;gap:16px;padding:18px 0;
}
.two {display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.three {display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.six {display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack {display:grid;gap:14px}
.card {
  background:white;border:1px solid var(--stone-200);border-radius:17px;
  padding:21px;box-shadow:0 2px 5px #00000003;
  transition:transform .2s,box-shadow .2s;
}
.card:hover {transform:translateY(-3px);box-shadow:0 8px 18px #00000008}
.card h3 {font-size:21px;color:var(--heading);margin-bottom:11px;line-height:1.2}
.card p,.card li {font-size:18px;line-height:1.5}
.card small {font-size:14px;line-height:1.5;color:var(--muted)}
.card.good {border-top:4px solid var(--green);background:#f5fcf8}
.card.bad {border-top:4px solid var(--red);background:#fff8f8}
.card.accent {border-top:4px solid var(--indigo);background:#f8f9ff}
.card.warn {border-top:4px solid var(--amber);background:#fffcf5}
.card.compact {padding:16px}
.card.compact h3 {font-size:19px;margin-bottom:7px}
.card.compact p {font-size:16px}
ul {margin:0;padding-left:22px}
li {font-size:19px;line-height:1.5;margin:7px 0}
li::marker {color:var(--indigo)}
code,kbd {font-family:"JetBrains Mono",monospace}
:not(pre)>code {
  background:var(--indigo-50);color:var(--indigo-dark);
  border-radius:5px;padding:2px 5px;font-size:.88em;
}
.code {
  position:relative;border-radius:15px;overflow:hidden;
  background:var(--code-bg);border:1px solid #292d3c;
}
.code-head {
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:#242735;color:#b5bdcf;
  font:11px "JetBrains Mono",monospace;letter-spacing:.4px;
}
.copy {
  background:transparent;color:#cbd5e1;border:1px solid #4b5264;
  border-radius:5px;padding:3px 8px;font:11px Inter,sans-serif;
}
pre {
  margin:0;padding:17px 20px;color:#e2e8f0;
  font:16px/1.45 "JetBrains Mono",monospace;
  white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;
}
.code.small pre {font-size:15px;line-height:1.4;padding:14px 18px}
.code.bad {border-left:5px solid var(--red)}
.code.good {border-left:5px solid var(--green)}
.callout {
  padding:14px 18px;border-radius:12px;background:var(--indigo-50);
  border-left:4px solid var(--indigo);
  font-size:18px;line-height:1.45;color:var(--indigo-dark);
}
.callout.warn {background:#fffbeb;border-color:var(--amber);color:#92400e}
.callout.good {background:#ecfdf5;border-color:var(--green);color:#065f46}
.callout.bad {background:#fef2f2;border-color:var(--red);color:#991b1b}
.flow { 
  display: flex;
  flex-wrap: wrap; /* Разрешает перенос элементов на новые строки */
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  width: 100%; 
}
.node {
  flex:1;background:var(--indigo-50);border:1px solid var(--indigo-100);
  border-radius:15px;padding:18px 12px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:9px;
}
.node strong {font-size:20px;color:var(--indigo-dark);line-height:1.25}
.node small {font-size:15px;color:var(--text);line-height:1.4}
.node.bad {background:#fef2f2;border-color:#fecaca}
.node.bad strong {color:#b91c1c}
.node.good {background:#ecfdf5;border-color:#a7f3d0}
.node.good strong {color:#047857}
.arrow {align-self:center;color:var(--indigo);font-size:27px;font-weight:800}
table {width:100%;border-collapse:separate;border-spacing:0;font-size:17px}
th {
  text-align:left;padding:11px 14px;background:var(--indigo-50);
  color:var(--indigo-dark);font-size:14px;
}
td {padding:10px 14px;border-bottom:1px solid var(--stone-200);line-height:1.35}
tr:last-child td {border-bottom:0}
.table-wrap {border:1px solid var(--stone-200);border-radius:14px;overflow:hidden}
.pill {
  display:inline-block;font-size:12px;font-weight:800;border-radius:7px;
  padding:5px 8px;background:var(--indigo-50);color:var(--indigo-dark);
}
.big {font-size:30px;line-height:1.35;color:var(--heading);font-weight:800}
.hero {display:grid;grid-template-columns:1.5fr .7fr;gap:34px;align-items:center}
.hero-symbol {
  font-size:110px;text-align:center;animation:float 5s ease-in-out infinite;
}
@keyframes float {50%{transform:translateY(-10px)}}
.tags {display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.footer {
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-top:12px;border-top:1px solid var(--stone-200);
  font-size:11px;color:var(--muted);
}
.footer a {color:var(--muted);text-decoration:none}
.footer a:hover {color:var(--indigo);text-decoration:underline}
.reveal {opacity:1}
.slide.active .reveal {animation:enter .35s ease both}
.slide.active .reveal:nth-child(2) {animation-delay:.05s}
@keyframes enter {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-dots {display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:15px}
.dot {
  width:9px;height:9px;padding:0;border:0;border-radius:50%;
  background:#d8d5ce;
}
.dot.active {background:var(--indigo);transform:scale(1.25)}
.meta-row {
  display:flex;justify-content:space-between;gap:12px;
  margin-top:12px;font-size:12px;color:var(--muted);
}
.notes {
  margin-top:18px;padding:20px 24px;background:#fff;border:1px solid var(--stone-200);
  border-radius:17px;line-height:1.65;font-size:15px;
}
.notes[hidden] {display:none}
.notes h3 {color:var(--heading);margin-bottom:10px;font-size:17px}
.notes a {color:var(--indigo)}
.notes p+p {margin-top:10px}
.notes .time {color:var(--indigo);font-weight:800;margin-bottom:10px}
.pyramid {display:grid;justify-items:center;gap:10px}
.pyramid div {
  text-align:center;padding:18px;border-radius:11px;font-weight:800;
}
.pyramid small {font-weight:400;display:block;margin-top:5px;font-size:15px}
.pyramid .e2e {width:42%;background:#fef3c7;color:#92400e}
.pyramid .integration {width:68%;background:var(--indigo-100);color:#3730a3}
.pyramid .unit {width:94%;background:#d1fae5;color:#065f46}
.checkline {display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.45}
.tick {color:var(--green);font-weight:900}
.steps {display:grid;gap:12px}
.step {display:grid;grid-template-columns:36px 1fr;gap:13px;align-items:start}
.step-num {
  width:32px;height:32px;display:grid;place-items:center;border-radius:9px;
  background:var(--indigo-50);color:var(--indigo);font-weight:900;
}
.step p {font-size:18px;line-height:1.4}
.read .slide {
  position:relative;opacity:1;transform:none;pointer-events:auto;
  margin-bottom:24px;border-bottom:1px solid var(--stone-200);
}
.read .deck {height:auto}
.read .screen {aspect-ratio:auto}
.read .slide-dots {display:none}
.present {overflow:hidden}
.present .topbar,.present .controller,.present .meta-row,
.present .slide-dots,.present .notes {display:none!important}
.present .screen {
  position:fixed;inset:0;width:100vw;height:100vh!important;
  border:0;border-radius:0;background:var(--bg);z-index:100;
}
.present .deck {
  left:50%;top:50%;transform-origin:center;
  transform:translate(-50%,-50%) scale(var(--scale));
}
@media(max-width:750px) {
  .topbar {padding:10px 12px;gap:8px}
  .brand small {display:none}
  .brand b {font-size:11px}
  .container {padding:10px}
  .controller {grid-template-columns:1fr auto;padding:10px}
  .controller select {grid-column:1/-1}
  .mode button {padding:8px;font-size:10px}
  .meta-row {font-size:10px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation:none!important;transition:none!important}
}
@media print {
  @page {size:320mm 180mm;margin:0}
  html,body {background:white}
  .topbar,.controller,.notes,.meta-row,.slide-dots,.progress {display:none!important}
  .container {max-width:none;margin:0;padding:0}
  .screen {height:auto!important;width:1200px;overflow:visible;border:0;border-radius:0}
  .deck {position:static;transform:none!important;height:auto}
  .slide {
    position:relative;opacity:1!important;transform:none!important;
    width:1200px;height:675px;break-after:page;margin:0!important;
  }
  .slide:last-child {break-after:auto}
  .gradient-mesh,.copy {display:none}
}
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">D</div>
    <div>
      <b id="deckTitle">Введение в DevOps</b>
      <small id="deckSubtitle">Лекция · CI/CD, Docker, Jenkins, Ansible · ~80 минут</small>
    </div>
  </div>
  <div class="mode">
    <button id="slideMode" class="active" type="button">Слайды</button>
    <button id="readMode" type="button">Чтение</button>
    <button id="notesButton" type="button">Заметки</button>
  </div>
</header>

<main class="container">
  <div class="controller">
    <select id="jump" aria-label="Перейти к слайду"></select>
    <span class="badge" id="counter">1 / 1</span>
    <div class="controls">
      <button class="btn" id="prev" aria-label="Предыдущий слайд">←</button>
      <button class="btn primary" id="next" aria-label="Следующий слайд">→</button>
      <button class="btn" id="full" aria-label="Полный экран">⛶</button>
    </div>
  </div>

  <div class="screen" id="screen">
    <div class="deck" id="deck"></div>
  </div>

  <nav class="slide-dots" id="dots" aria-label="Навигация по слайдам"></nav>

  <div class="meta-row">
    <span>← → / Space — навигация · N — заметки · F — экран · R — чтение</span>
    <span id="timing"></span>
  </div>

  <aside class="notes" id="notes" hidden aria-label="Заметки преподавателя"></aside>
</main>

<script>
"use strict";

const slides = [];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

function code(lang, text, kind="") {
  return `<div class="code ${kind} reveal">
    <div class="code-head"><span>${esc(lang)}</span>
      <button class="copy" type="button">Копировать</button>
    </div><pre><code>${esc(text.trim())}</code></pre></div>`;
}
function card(title, body, kind="") {
  return `<div class="card ${kind} reveal"><h3>${title}</h3>${body}</div>`;
}
function two(a,b) { return `<div class="two">${a}${b}</div>`; }
function three(a,b,c) { return `<div class="three">${a}${b}${c}</div>`; }
function callout(text, kind="") {
  return `<div class="callout ${kind} reveal">${text}</div>`;
}
function table(head, rows) {
  return `<div class="table-wrap reveal"><table>
    <thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}
function flow(items) {
  return `<div class="flow reveal">${items.map((x,i)=>
    `${i?'<div class="arrow">→</div>':""}
    <div class="node ${x[2]||""}"><strong>${x[0]}</strong><small>${x[1]||""}</small></div>`
  ).join("")}</div>`;
}
function checks(items) {
  return `<div class="stack">${items.map(t=>
    `<div class="checkline reveal"><span class="tick">✓</span><span>${t}</span></div>`
  ).join("")}</div>`;
}
function steps(items) {
  return `<div class="steps">${items.map((t,i)=>
    `<div class="step reveal"><span class="step-num">${i+1}</span><p>${t}</p></div>`
  ).join("")}</div>`;
}

function add(title, subtitle, body, notes="", refs=[], duration=60, section=null) {
  slides.push({
    title, subtitle, body,
    notes: notes || "",
    refs: refs || [],
    duration,
    section: section || {name: "Слайд", time: ""}
  });
}

/* ═══════════════ РАЗДЕЛ 1 · ВВЕДЕНИЕ ═══════════════ */

add(
  "Введение в DevOps",
  "От написанного кода до работающего сервиса: непрерывная интеграция, доставка и эксплуатация",
  '<div class="hero"><div>' +
  '<p class="big">Лекция 80 минут · 8 разделов · практический уклон</p>' +
  '<div class="tags"><span class="pill">CI</span><span class="pill">CD</span>' +
  '<span class="pill">Docker</span><span class="pill">Jenkins</span>' +
  '<span class="pill">Ansible</span><span class="pill">Kubernetes</span></div></div>' +
  '<div class="hero-symbol">∞</div></div>',
  "",
  [["Доклад Декона на конференции Agile 2008", "https://www.youtube.com/watch?v=LdOe18KhtT4"]],
  60,
  {name: "Введение", time: "0:00"}
);

add(
  "План лекции",
  "Восемь разделов — от проблемы до полного пайплайна",
  flow([["Введение", "идея и культура DevOps"],
    ["CI", "непрерывная интеграция, сборка"],
    ["Тесты", "пирамида, quality gates"],
    ["CD", "доставка и развёртывание"],
    ["Docker", "контейнеры, образы"],
    ["Jenkins", "серверы автоматизации"],
    ["Ansible", "конфигурация и IaC"],
    ["Итоги", "путь вашего приложения"]
  ]) +
  callout("Что именно автоматизируем и зачем?"),
  "",
  [],
  70,
  {name: "Введение", time: "1:00"}
);

add(
  "Где мы сейчас",
  "Вы уже умеете создавать приложение — осталось научиться его эксплуатировать",
  three(
    card("Что пройдено", "<ul><li>Основы фронтенда: HTML, CSS, JavaScript</li><li>Основы бэкенда: HTTP, REST, Node.js/Express</li><li>Базы данных: SQL, простые схемы</li><li>Простое веб-приложение, работающее локально</li></ul>", "good"),
    card("Что происходит сейчас", "<ul><li>Приложение запускается на вашем ноутбуке</li><li>Зависит от вашей ОС и установленных версий</li><li>Данные живут в локальной базе</li><li>Демонстрация = «подойдите посмотреть»</li></ul>", "warn"),
    card("Что нужно дальше", "<ul><li>Развернуть приложение на сервере</li><li>Обновлять его без простоя и ручной работы</li><li>Повторять развёртывание в любой среде</li><li>Знать, работает ли сервис прямо сейчас</li></ul>", "accent")
  ) +
  callout("DevOps отвечает на вопрос: как превратить папку с кодом в надёжно работающий сервис."),
  "",
  [],
  80,
  {name: "Введение", time: "2:10"}
);

add(
  "Проблема: «у меня работает!»",
  "Классический разрыв между разработкой и эксплуатацией",
  two(
    card("Разработчик говорит", "<ul><li>«Всё работает на моей машине»</li><li>«Ты просто неправильно запускаешь»</li><li>«У тебя старая версия Node.js»</li><li>«Настрой переменную окружения — очевидно же»</li></ul>", "bad"),

    card("Принцип Terraform", "<p>HCL-файлы описывают желаемое состояние облака; команда <code>terraform apply</code> сравнивает файл с реальностью и вносит только необходимые изменения — «план» показывается перед применением.</p>", "")
  ) +
  callout("Облака (AWS, Yandex Cloud, Selectel) управляются так же декларативно, как серверы — через API, а не веб-консоль.", ""),
  "",
  [],
  70,
  {name: "Ansible и IaC", time: "76:10"}
);

add(
  "Секреты и переменные окружения",
  "Пароли в git — никогда; секреты — в менеджерах",
  two(
    card("Что нельзя", "<ul><li>.env с паролем к БД в репозитории — классическая утечка</li><li>Пароли в Dockerfile, Jenkinsfile, playbook в открытом виде</li><li>«Временный» root-пароль, который живёт годами</li></ul>", "bad"),
    card("Что вместо этого", "<ul><li>Менеджеры секретов: HashiCorp Vault, Ansible Vault, SOPS</li><li>Встроенные хранилища CI: GitLab CI/CD Variables, Jenkins Credentials</li><li>Принцип наименьших прав: CI деплоит только то, что нужно</li></ul>", "good")
  ) +
  callout("Правило раздела: любой секрет попадает на сервер из хранилища во время выполнения, а не из git-истории.", "accent"),
  "Типовая утечка: разработчик коммитит .env, потом удаляет файл — но история git помнит всё. Отсюда: секреты нельзя «вычищать задним числом», их можно только отозвать. DevSecOps-проверки сканеров секретов (gitleaks, trufflehog) — стандартный gate в пайплайне.",
  [],
  80,
  {name: "Ansible и IaC", time: "77:20"}
);

/* ═══════════════ РАЗДЕЛ 8 · БОЛЬШАЯ КАРТИНА И ИТОГИ ═══════════════ */

add(
  "Kubernetes и оркестрация: обзор",
  "Что происходит, когда контейнеров становится сотни",
  '<p class="big">Kubernetes (K8s) — система оркестрации контейнеров: следит, чтобы заданное количество реплик приложения работало, перезапускает упавшие, распределяет нагрузку и раскатывает обновления по кластеру.</p>' +
  flow([
    ["Deployment", "желаемое состояние: «3 реплики app:0.1.0»"],
    ["Pods", "группа контейнеров — единица запуска"],
    ["Service", "стабильная точка входа на поды"],
    ["Ingress", "HTTP-маршрутизация извне"],
    ["Rollout", "обновление по одному поду — rolling из раздела CD"]
  ]) +
  callout("На этой лекции — только карта: K8s — отдельный большой курс. Главное сейчас: декларативность и самовосстановление.", "warn"),
  "",
  [["Kubernetes", "https://kubernetes.io/"]],

  {name: "Итоги и практика", time: "78:40"}

add(
  "Наблюдаемость: метрики, логи, трассировки",
  "Сервис, о котором ничего не известно, — неуправляем",
  three(
    card("Метрики", "<p>Числа во времени: RPS, latency, ошибки, память. Сбор: Prometheus. Визуализация и алерты: Grafana.</p><small>Алерт «5xx больше 1% в течение 5 минут» будит дежурного раньше пользователей</small>", "accent"),
    card("Логи", "<p>Структурированные записи событий: JSON-логи приложения, агрегация через Loki или ELK-стек.</p><small>docker logs — минимальный вариант; промышленный — централизованный поиск по всем серверам</small>", ""),
    card("Трассировки", "<p>Цепочка запроса через сервисы: фронтенд → API → БД. OpenTelemetry — общий стандарт.</p><small>Показывает, где именно теряются 300 мс</small>", "accent")
  ) +
  callout("Это замыкает цикл DevOps: мониторинг → сигнал → изменение → снова в пайплайн.", "good"),
  "Три столпа наблюдаемости. Пример инцидента: latency выросла — метрика показала рост, логи нашли медленный SQL-запрос, трейс показал, что тормозит именно подключение к БД. DevOps-цикл: фикс → CI → CD → наблюдение за метриками. Дежурства и runbooks — стандартная часть работы.",
  [],
  80,
  {name: "Итоги и практика", time: "80:00"}
);

add(
  "Путь вашего приложения: итоговая схема",
  "Всё, пройденное за лекцию, — одна цепочка",
  flow([
    ["Вы пишете код", "фича в ветке, push"],
    ["Merge request", "ревью + CI: lint, тесты, сборка"],
    ["Docker", "образ с тегом git SHA → реестр"],
    ["CD", "staging автоматически, e2e-тесты"],
    ["Prod", "канарея, метрики, алерты"],
    ["Ansible/IaC", "серверы подготовлены кодом"],
    ["Мониторинг", "сигнал → следующая итерация"]
  ]),
  "",
  [],
  90,
  {name: "Итоги и практика", time: "81:20"}
);

add(
  "Резюме лекции",
  "Десять тезисов, которые должны остаться",
  two(
    checks([
      "DevOps — культура и практики, а не набор инструментов; ответственность за продукт не заканчивается коммитом",
      "CI: мелкие слияния, автоматические сборка и тесты, зелёная main — всегда",
      "Система сборки по манифесту даёт воспроизводимый артефакт",
      "CD: один артефакт продвигается по окружениям; развёртывание — штатная операция, а не событие",
      "Docker упаковывает приложение с окружением; образ неизменяем, версионируется тегами"
    ]),
    checks([
      "Jenkins/GitLab CI/Actions — оркестраторы одних и тех же концепций: пайплайн это код",
      "Ansible приводит серверы к описанному в файле состоянию; идемпотентность — ключ",
      "IaC и Terraform распространяют декларативность на сами ресурсы облака",

    ])
  ) +
  callout("Формула DevOps: автоматизировать путь кода до пользователя и наблюдать результат — и повторять.", "good"),

  [],
  80,
  {name: "Итоги и практика", time: "84:30"}

/* ─────────────── ДВИЖОК ─────────────── */

if (slides.length === 0) {
  add("Пустая презентация", "Добавьте слайды через add(...)", "");
}

const formatTime = seconds => {
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return `${m}:${String(s).padStart(2,"0")}`;
};

const deck = document.getElementById("deck");
const jump = document.getElementById("jump");
const dots = document.getElementById("dots");
let elapsed = 0;

slides.forEach((s,index)=>{
  const n=index+1;
  s.start=elapsed;
  s.end=elapsed+s.duration;
  elapsed=s.end;

  const article=document.createElement("section");
  article.className=`slide slide-${n}${n===1?" active":""}`;
  article.dataset.slide=n;
  article.id=`slide-${n}`;
  article.setAttribute("aria-label",`${n}. ${s.title}`);
  article.setAttribute("aria-hidden",n===1?"false":"true");

  const titleTag=n===1?"h1":"h2";
  const source=s.refs[0];
  article.innerHTML=`
    <div class="gradient-mesh" aria-hidden="true">
      <div class="blob"></div><div class="blob"></div>
    </div>
    <div class="content">
      <header class="reveal">
        <div class="eyebrow">${esc(s.section.name)}</div>
        <${titleTag}>${esc(s.title)}</${titleTag}>
        <p class="subtitle">${esc(s.subtitle)}</p>
      </header>
      <div class="body">${s.body}</div>
      <footer class="footer">
        <span>${esc(s.section.time || "")}</span>
        <span>${source
          ?`<a href="${esc(source[1])}" target="_blank" rel="noopener noreferrer">${esc(source[0])} ↗</a>`
          :""}</span>
        <span>${String(n).padStart(2,"0")} / ${String(slides.length).padStart(2,"0")}</span>
      </footer>
    </div>`;
  deck.appendChild(article);

  const option=document.createElement("option");
  option.value=n;
  option.textContent=`${String(n).padStart(2,"0")} · ${s.title}`;
  jump.appendChild(option);

  const dot=document.createElement("button");
  dot.type="button";
  dot.className="dot"+(n===1?" active":"");
  dot.title=`${n}. ${s.title}`;
  dot.setAttribute("aria-label",dot.title);
  dot.addEventListener("click",()=>goToSlide(n,true));
  dots.appendChild(dot);
});

const totalSeconds = elapsed;

let current=1;
let readMode=false;
let notesVisible=false;
let presenting=false;

function fit() {
  const screen=document.getElementById("screen");
  let scale;
  if (presenting) {
    scale=Math.min(window.innerWidth/1200,window.innerHeight/675);
  } else {
    scale=screen.clientWidth/1200;
  }
  document.documentElement.style.setProperty("--scale",String(scale));
  if (readMode && !presenting) {
    screen.style.height=`${((675+24)*slides.length-24)*scale}px`;
  } else {
    screen.style.height="";
  }
}

function renderNotes() {
  const s=slides[current-1];
  const note=document.getElementById("notes");
  const refs=s.refs.map(r=>
    `<a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a>`
  ).join(" · ");
  note.innerHTML=`
    <h3>${current}. ${esc(s.title)}</h3>
    <p class="time">${formatTime(s.start)}–${formatTime(s.end)}
      · на слайд ${s.duration} сек.
      · раздел «${esc(s.section.name)}»</p>
    ${s.notes.split("\n").map(p=>`<p>${esc(p)}</p>`).join("")}
    ${refs?`<p><b>Документация:</b> ${refs}</p>`:""}`;
  note.hidden=!notesVisible;
}

function goToSlide(n,scroll=false) {
  n=Math.max(1,Math.min(slides.length,Number(n)||1));
  current=n;
  document.querySelectorAll(".slide").forEach((el,i)=>{
    el.classList.toggle("active",i+1===current);
    el.setAttribute("aria-hidden",readMode||i+1===current?"false":"true");
  });
  document.querySelectorAll(".dot").forEach((el,i)=>{
    el.classList.toggle("active",i+1===current);
    el.setAttribute("aria-current",i+1===current?"step":"false");
  });
  jump.value=String(current);
  document.getElementById("counter").textContent=`${current} / ${slides.length}`;
  document.getElementById("progress").style.width=`${current/slides.length*100}%`;
  document.getElementById("prev").disabled=current===1;
  document.getElementById("next").disabled=current===slides.length;

  const s=slides[current-1];
  document.getElementById("timing").textContent=
    `${formatTime(s.start)}–${formatTime(s.end)} / ${formatTime(totalSeconds)} · ${s.duration} сек.`;

  renderNotes();
  try { history.replaceState(null,"",`#slide=${current}`); } catch {}
  if(readMode&&scroll) {
    document.getElementById(`slide-${current}`).scrollIntoView({
      behavior:"smooth",block:"start"
    });
  }
}

function changeSlide(delta) {goToSlide(current+delta,true)}

function setReadMode(value) {
  if(presenting) exitPresentation();
  readMode=Boolean(value);
  document.body.classList.toggle("read",readMode);
  document.getElementById("readMode").classList.toggle("active",readMode);
  document.getElementById("slideMode").classList.toggle("active",!readMode);
  fit();
  goToSlide(current,readMode);
}

function toggleNotes() {
  notesVisible=!notesVisible;
  document.getElementById("notesButton").classList.toggle("active",notesVisible);
  renderNotes();
}

async function startPresentation() {
  if(presenting) {await exitPresentation();return}
  if(readMode) setReadMode(false);
  presenting=true;
  document.body.classList.add("present");
  try {
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
  } catch {
    // Режим презентации работает и без Fullscreen API.
  }
  fit();
}

async function exitPresentation() {
  presenting=false;
  document.body.classList.remove("present");
  try {
    if(document.fullscreenElement) await document.exitFullscreen();
  } catch {}
  fit();
}

document.getElementById("prev").onclick=()=>changeSlide(-1);
document.getElementById("next").onclick=()=>changeSlide(1);
document.getElementById("full").onclick=startPresentation;
document.getElementById("slideMode").onclick=()=>setReadMode(false);
document.getElementById("readMode").onclick=()=>setReadMode(true);
document.getElementById("notesButton").onclick=toggleNotes;
jump.onchange=()=>goToSlide(jump.value,true);

document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select,button,a,[contenteditable=true]")) return;
  const key=e.key.toLowerCase();
  if(["arrowright","arrowleft"," ","pagedown","pageup","home","end"].includes(key))
    e.preventDefault();
  if(key==="arrowright"||key===" "||key==="pagedown") changeSlide(1);
  if(key==="arrowleft"||key==="pageup") changeSlide(-1);
  if(key==="home") goToSlide(1,true);
  if(key==="end") goToSlide(slides.length,true);
  if(key==="n"||key==="т") toggleNotes();
  if(key==="r"||key==="к") setReadMode(!readMode);
  if(key==="f"||key==="а") startPresentation();
  if(key==="escape"&&presenting) exitPresentation();
});

document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement&&presenting) {
    presenting=false;
    document.body.classList.remove("present");
  }
  fit();
});

let touchX=0,touchY=0;
document.getElementById("screen").addEventListener("touchstart",e=>{
  touchX=e.changedTouches[0].clientX;
  touchY=e.changedTouches[0].clientY;
},{passive:true});

document.getElementById("screen").addEventListener("touchend",e=>{
  if(readMode) return;
  const dx=touchX-e.changedTouches[0].clientX;
  const dy=touchY-e.changedTouches[0].clientY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)
    changeSlide(dx>0?1:-1);
},{passive:true});

document.addEventListener("click",async e=>{
  const button=e.target.closest(".copy");
  if(!button) return;
  const text=button.closest(".code").querySelector("pre").textContent;
  try {
    if(navigator.clipboard&&window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const textarea=document.createElement("textarea");
      textarea.value=text;
      textarea.style.cssText="position:fixed;left:-9999px;top:0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied=document.execCommand("copy");
      textarea.remove();
      if(!copied) throw new Error("Copy unavailable");
    }
    button.textContent="Скопировано";
  } catch {
    button.textContent="Выделите код";
  }
  setTimeout(()=>button.textContent="Копировать",1500);
});

window.addEventListener("resize",fit);
const initial=/slide=(\d+)/.exec(location.hash);
goToSlide(initial?Number(initial[1]):1);
fit();
if(document.fonts) document.fonts.ready.then(fit);
</script>
